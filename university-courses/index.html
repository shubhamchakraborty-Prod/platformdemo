<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Future Skills Labs and Swift AI Academy</title>
<meta name="description" content="Future Skills Labs for schools, Swift AI Academy for higher education, and upcoming courses from OEMs and learning providers.">
<link rel="icon" type="image/png" href="images/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A33; --ink-2:#32304B; --ink-3:#4A5063; --ink-4:#5F6485;
  --line:#D5D8DF; --bg:#F4F6FB; --surface:#FFFFFF;
  --blue:#386AF6; --blue-d:#2548E8; --blue-ink:#1339A3; --blue-soft:#ECF0FF; --blue-line:#B8C4F5;
  --green-soft:#E3F4E8; --green-ink:#146C2E; --amber-soft:#FFF4D6; --amber-ink:#7A4F00; --grey-soft:#F1F2F5; --grey-ink:#4B5063;
  --head-h:64px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{ font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; line-height:20px; color:var(--ink); background:var(--bg); }
img{ max-width:100%; }
button{ font:inherit; }
a{ color:inherit; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* header with the two programme tabs */
.top{ position:sticky; top:0; z-index:40; height:var(--head-h); display:flex; align-items:center; gap:20px; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; flex:0 0 auto; }
.brand img{ width:36px; height:21px; }
.tabs{ display:flex; gap:4px; height:100%; }
.tabs a{ display:flex; flex-direction:column; justify-content:center; padding:0 16px; border-bottom:3px solid transparent; text-decoration:none; white-space:nowrap; }
.tabs a b{ font-size:15px; font-weight:700; color:var(--ink-2); }
.tabs a small{ font-size:11.5px; font-weight:500; color:var(--ink-4); }
.tabs a:hover b{ color:var(--blue-ink); }
.tabs a[aria-current="page"]{ border-bottom-color:var(--blue); }
.tabs a[aria-current="page"] b{ color:var(--blue-ink); }

/* page */
.wrap{ max-width:1180px; margin:0 auto; padding:32px 24px 64px; }
.eyebrow{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#2449D8; }
.hero h1{ font-size:34px; line-height:42px; font-weight:700; margin-top:6px; }
.hero p{ font-size:15px; line-height:23px; color:var(--ink-3); margin-top:8px; max-width:660px; }
.stats{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.stat{ display:inline-flex; align-items:baseline; gap:6px; padding:8px 14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; font-size:13px; color:var(--ink-3); }
.stat b{ font-size:18px; color:var(--ink); }
.tools{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:24px; }
.search{ flex:0 1 300px; height:42px; padding:0 16px; border:1px solid var(--line); border-radius:999px; font:inherit; font-size:14px; background:var(--surface); color:var(--ink); }
.search:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(56,106,246,.18); }
.search::placeholder{ color:#6B7391; }
.jump{ display:flex; gap:8px; flex-wrap:wrap; }
.chip-btn{ height:38px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:14px; font-weight:500; color:var(--ink-2); cursor:pointer; white-space:nowrap; }
.chip-btn:hover{ border-color:var(--blue); color:var(--blue-ink); background:var(--blue-soft); }

.sec{ margin-top:40px; scroll-margin-top:calc(var(--head-h) + 16px); }
.sec-head h2{ display:flex; align-items:center; gap:10px; font-size:22px; line-height:30px; font-weight:700; }
.count{ font-size:12px; font-weight:600; color:var(--blue-ink); background:var(--blue-soft); border-radius:999px; padding:2px 9px; }
.sec-head p{ font-size:14px; color:var(--ink-3); margin-top:4px; }
.sub-h{ margin-top:22px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; margin-top:16px; }

/* course cards */
.card{ position:relative; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; text-decoration:none; transition:box-shadow .15s, transform .15s, border-color .15s; }
a.card:hover{ box-shadow:0 8px 24px rgba(20,26,51,.12); transform:translateY(-2px); border-color:var(--blue-line); }
.thumb{ position:relative; aspect-ratio:8/5; overflow:hidden; background:linear-gradient(135deg,var(--c1),var(--c2)); }
.thumb img{ display:block; width:100%; height:100%; object-fit:cover; object-position:center; }
.tag{ position:absolute; right:10px; bottom:10px; padding:3px 8px; border-radius:6px; background:var(--ink); color:#fff; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.playbtn{ position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:rgba(20,26,51,.8); color:#fff; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
.playbtn svg{ width:24px; height:24px; margin-left:3px; }
a.card:hover .playbtn, a.card:focus-visible .playbtn{ opacity:1; }
.body{ display:flex; flex-direction:column; gap:4px; flex:1; padding:14px 16px 16px; }
.prov{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; font-weight:600; color:var(--ink-3); }
.lvl-lg{ font-size:13px; padding:3px 10px; border-radius:8px; }
.grp{ display:flex; align-items:center; gap:8px; margin-top:24px; font-size:16px; line-height:22px; font-weight:700; color:var(--ink); }
.lvl{ flex:0 0 auto; padding:2px 8px; border:1px solid var(--blue-line); border-radius:6px; background:var(--blue-soft); color:var(--blue-ink); font-size:11.5px; font-weight:600; white-space:nowrap; }
.body h3{ font-size:16px; line-height:22px; font-weight:700; color:var(--ink); }
.one{ font-size:13px; line-height:19px; color:var(--ink-3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.meta{ font-size:12.5px; color:var(--ink-4); }
.foot{ margin-top:auto; padding-top:8px; }
.pill{ display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
.pill.new{ background:var(--blue-soft); color:var(--blue-ink); }
.pill.go{ background:var(--amber-soft); color:var(--amber-ink); }
.pill.done{ background:var(--green-soft); color:var(--green-ink); }
.pill.soon{ background:var(--grey-soft); color:var(--grey-ink); }
.pill.act{ background:var(--blue); color:#fff; }
a.card:hover .pill.act{ background:var(--blue-d); }

/* upcoming level / pathway entries: compact, non-interactive */
.lv-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; margin-top:12px; }
.lv{ display:flex; align-items:center; gap:14px; padding:12px 14px; background:var(--surface); border:1px dashed #B9BFCC; border-radius:14px; }
.lv-art{ flex:0 0 auto; width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--c1),var(--c2)); opacity:.85; }
.lv-art svg{ width:26px; height:26px; }
.lv-txt{ flex:1; min-width:0; }
.lv-txt{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.lv-txt h3{ font-size:15px; line-height:21px; font-weight:700; }
.lv-txt p{ font-size:12.5px; line-height:17px; color:var(--ink-4); margin-top:-4px; }
.lv-txt p{ font-size:12.5px; color:var(--ink-4); }

/* providers */
.domains{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; list-style:none; }
.domains li{ padding:5px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:13px; font-weight:500; color:var(--ink-2); }
.pv-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; margin-top:16px; }
.pv{ display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; gap:14px; min-height:112px; padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:14px; }
.pv h3{ font-size:20px; line-height:26px; font-weight:700; color:var(--ink); }
.pv-more{ margin-top:14px; font-size:13px; color:var(--ink-4); }
.domains li{ font-size:14px; padding:8px 16px; }

.empty{ margin-top:32px; color:var(--ink-3); }
.site-foot{ margin-top:56px; padding-top:20px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-4); }

/* samples view */
.back{ display:inline-flex; align-items:center; gap:4px; height:38px; padding:0 14px 0 8px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:14px; font-weight:600; color:var(--ink-2); cursor:pointer; text-decoration:none; }
.back:hover{ background:var(--blue-soft); border-color:var(--blue-line); }
.back svg{ width:20px; height:20px; }
.note{ display:flex; gap:10px; align-items:flex-start; margin-top:18px; padding:12px 16px; border-radius:12px; background:var(--amber-soft); color:var(--amber-ink); font-size:14px; font-weight:500; max-width:660px; }
.note svg{ width:20px; height:20px; flex:0 0 auto; }
.sm-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:14px; }
.sm{ display:flex; flex-direction:column; gap:10px; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; text-decoration:none; transition:box-shadow .15s, border-color .15s; }
.sm:hover{ border-color:var(--blue-line); box-shadow:0 6px 18px rgba(20,26,51,.1); }
.sm-top{ display:flex; align-items:center; gap:10px; }
.sm-ic{ flex:0 0 auto; width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--blue-soft); color:var(--blue-ink); }
.sm-ic svg{ width:20px; height:20px; }
.sm h3{ font-size:15px; line-height:21px; font-weight:700; color:var(--ink); }
.sm small{ display:block; font-size:12px; color:var(--ink-4); }
.sm-cta{ display:inline-flex; align-items:center; gap:6px; align-self:flex-start; height:34px; padding:0 14px; border-radius:999px; background:var(--blue); color:#fff; font-size:13px; font-weight:600; }
.sm:hover .sm-cta{ background:var(--blue-d); }
.sm-cta svg{ width:14px; height:14px; }
.sm.folder{ border-style:dashed; border-color:#B9BFCC; background:#FAFBFD; }
.sm.folder .sm-ic{ background:var(--grey-soft); color:var(--grey-ink); }
.sm.folder .sm-cta{ background:var(--surface); color:var(--ink-2); border:1px solid var(--line); }
.sm.folder:hover .sm-cta{ background:var(--grey-soft); }

/* player */
body.playing{ overflow:hidden; }
.player{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; background:var(--surface); }
.pbar{ display:flex; align-items:center; gap:12px; min-height:var(--head-h); padding:8px 16px; border-bottom:1px solid var(--line); background:var(--surface); }
.ptitle{ flex:1; min-width:0; display:flex; flex-direction:column; }
.ptitle small{ font-size:12px; font-weight:600; color:var(--ink-4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ptitle b{ font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pact{ display:flex; align-items:center; gap:8px; }
.pbtn{ width:38px; height:38px; border:1px solid var(--line); border-radius:50%; background:var(--surface); color:var(--ink-2); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.pbtn svg{ width:20px; height:20px; }
.pbtn:hover:not(:disabled){ background:var(--blue-soft); border-color:var(--blue-line); }
.pbtn:disabled{ opacity:.4; cursor:default; }
.pdone{ height:38px; padding:0 16px; border:0; border-radius:999px; background:var(--blue); color:#fff; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
.pdone:hover{ background:var(--blue-d); }
.pdone.on{ background:var(--green-soft); color:var(--green-ink); }
.stage{ position:relative; flex:1; background:#fff; }
.stage iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
.loading{ position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; background:#fff; color:var(--ink-3); pointer-events:none; }
.loading span{ width:32px; height:32px; border-radius:50%; border:3px solid var(--blue-soft); border-top-color:var(--blue); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.toast{ position:fixed; left:50%; bottom:24px; z-index:60; transform:translateX(-50%); max-width:calc(100% - 32px); padding:12px 18px; border-radius:12px; background:var(--ink); color:#fff; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.2); }

@media (max-width:700px){
  :root{ --head-h:60px; }
  .top{ padding:0 12px; gap:8px; }
  .brand img{ width:30px; height:18px; }
  .tabs{ flex:1; gap:0; }
  .brand{ display:none; }
  .tabs a{ flex:1; align-items:center; padding:0 4px; text-align:center; }
  .tabs a b{ font-size:12.5px; line-height:16px; white-space:normal; }
  .tabs a small{ font-size:10px; line-height:13px; }
  .wrap{ padding:24px 16px 48px; }
  .hero h1{ font-size:26px; line-height:34px; }
  .search{ flex:1 1 100%; }
  .jump{ flex-wrap:nowrap; overflow-x:auto; margin:0 -16px; padding:0 16px 2px; scrollbar-width:none; }
  .grid{ grid-template-columns:1fr 1fr; gap:12px; }
  .body{ padding:10px 12px 12px; }
  .body h3{ font-size:14px; line-height:19px; }
  .prov{ flex-direction:column; align-items:flex-start; gap:4px; }
  .one{ display:none; }
  .tag{ font-size:10px; right:8px; bottom:8px; }
  .lv-grid, .sm-grid{ grid-template-columns:1fr; }
  .pv-grid{ grid-template-columns:1fr 1fr; gap:12px; }
  .pbar{ padding:6px 10px; gap:8px; }
  .pbar .back span, #prev, #next{ display:none; }
  .pbar .back{ padding:0 8px; }
  .pdone{ padding:0 12px; font-size:13px; }
}
@media (max-width:420px){ .grid{ grid-template-columns:1fr; } }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div id="page">
  <header class="top">
    <a class="brand" href="#/labs" aria-label="Home"><img src="images/logo-icon.png" alt="" width="36" height="21"></a>
    <nav class="tabs" aria-label="Programmes">
      <a href="#/labs" id="tab-labs"><b>Future Skills Labs</b><small>For schools</small></a>
      <a href="#/academy" id="tab-academy"><b>Swift AI Academy</b><small>Higher education</small></a>
      <a href="#/oem" id="tab-oem"><b>OEMs and Domains</b><small>Coming soon</small></a>
    </nav>
  </header>
  <main class="wrap" id="main"></main>
</div>

<div class="player" id="player" hidden>
  <div class="pbar">
    <button class="back" onclick="leavePlayer()" aria-label="Back to courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span id="pback-label">All courses</span></button>
    <div class="ptitle"><small id="psub"></small><b id="ptitle"></b></div>
    <div class="pact">
      <button class="pbtn" id="prev" onclick="step(-1)" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="pbtn" id="next" onclick="step(1)" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="pbtn" onclick="fullScreen()" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="pdone" id="done" onclick="toggleDone()"></button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="loading" id="loading"><span></span>Loading</div>
    <iframe id="frame" title="Course" allow="fullscreen; autoplay; clipboard-write; encrypted-media; microphone; camera; web-share" allowfullscreen></iframe>
  </div>
</div>

<script>
/* =====================================================================
   DATA
   Tabs: #/labs (schools), #/academy (higher education), #/oem (providers)
   Courses with url play inside this page (same tab).
   Thumbnails: images/courses/<id>.webp
   ===================================================================== */
const PROGRAMMES = {
  labs:    {title:'Future Skills Labs', back:'All labs',    brand:'Future Skills Labs', foot:'&copy; 2026 ConveGenius.AI.'},
  academy: {title:'Swift AI Academy',   back:'All courses', brand:'Swift AI Academy',   foot:'&copy; 2026 Swift AI Academy, ConveGenius.AI.'},
  oem:     {title:'OEMs and Domains',   foot:'&copy; 2026 Swift AI Academy, ConveGenius.AI.'}
};
const SECTIONS = [
  {id:'fsl', prog:'labs',    title:'Future Skills Lab', unit:'Lab', c1:'#0F766E', c2:'#14B8A6', level:'School level'},
  {id:'aai', prog:'academy', title:'Applied AI',        c1:'#4C1D95', c2:'#7C3AED', level:'NSQF Level 4'}
];
const COURSES = [
  {id:'pitch-building',         sec:'fsl', title:'Pitch Building',          url:'https://pitch-building-v1.netlify.app/'},
  {id:'your-snack-brand',       sec:'fsl', title:'Your Snack Brand',        url:'https://your-snack-brand.vercel.app/'},
  {id:'launch-day-snack-brand', sec:'fsl', title:'Launch Day: Snack Brand', url:'https://launch-day-snack-brand.vercel.app/'},
  {id:'the-library-sorter',     sec:'fsl', title:'The Library Sorter',      url:'https://the-library-sorter.vercel.app/'},
  {id:'seesaw-for-everyone',    sec:'fsl', title:'Seesaw for Everyone',     url:'https://seesaw-for-everyone.vercel.app/'},
  {id:'create-my-plate',        sec:'fsl', title:'Create My Plate',         url:'https://create-my-plate.netlify.app/'},
  {id:'truthlens',              sec:'fsl', title:'TruthLens',               url:'https://truthlens-v1.netlify.app/'},

  {id:'applied-ai-1-use-it-and-check-it', sec:'aai', title:'Applied AI 1: Use It, and Check It', url:'https://aai-tau.vercel.app/course.html#S01', hours:16, one:'Use an AI app on real tasks and check every answer before you use it.'}
];
COURSES.forEach(c=>{ c.img = c.img || 'images/courses/'+c.id+'.webp'; c.level = c.level || (SECTIONS.find(s=>s.id===c.sec).level || ''); });

/* Communication Skills, NSQF Level 1: Module 1 samples (source: tracker column G, verbatim) */
const COMM_L1 = {
  title:'Communication Skills', level:'NSQF Level 1', course:'Basic and Foundational Workplace Communication', module:'Module 1 samples',
  note:'Preview samples. Content is under review.',
  groups:[['Reading Card','Reading cards'], ['Quiz','Quizzes'], ['Voice Input','Voice practice'], ['Graded Voice Capture','Graded voice capture'], ['Game','Games'], ['Open Problem','Open problems']],
  items:[
    {type:'Reading Card', label:'Reading Card 1', url:'https://readingmaterial1.vercel.app/', kind:'web'},
    {type:'Reading Card', label:'Reading Card 2', url:'https://module1readingcard.vercel.app/', kind:'web'},
    {type:'Quiz', label:'Quiz 1', url:'https://quiz1-sigma-six.vercel.app/', kind:'web'},
    {type:'Quiz', label:'Quiz 2', url:'https://quiz-2-kohl.vercel.app/', kind:'web'},
    {type:'Quiz', label:'Quiz 3', url:'https://quiz-3-alpha.vercel.app/', kind:'web'},
    {type:'Voice Input', label:'Voice Input asset folder', url:'https://drive.google.com/drive/folders/1sCoR5Y4OIsficwd9qNLA7-nEzTU-jXag', kind:'folder'},
    {type:'Graded Voice Capture', label:'Graded Voice Capture asset folder', url:'https://drive.google.com/drive/folders/1Oe6NpkYRydNW5ygsMlTfEeg0wNqs6Z1u', kind:'folder'},
    {type:'Game', label:'Game asset folder', url:'https://drive.google.com/drive/folders/1KQME7dm1mOLhSyh1_j749KhUoSWSJM54', kind:'folder'},
    {type:'Open Problem', label:'Open Problem 1', url:'https://open-problem-1.vercel.app/', kind:'web'},
    {type:'Open Problem', label:'Open Problem 2', url:'https://open-problem-2.vercel.app/', kind:'web'},
    {type:'Open Problem', label:'Open Problem 3', url:'https://open-problem-3.vercel.app/', kind:'web'},
    {type:'Open Problem', label:'Open Problem 4', url:'https://open-problem-4.vercel.app/', kind:'web'},
    {type:'Open Problem', label:'Open Problem 5', url:'https://open-problem-5.vercel.app/', kind:'web'},
    {type:'Open Problem', label:'Open Problem 6', url:'https://open-problem-6.vercel.app/', kind:'web'},
    {type:'Open Problem', label:'Open Problem 7', url:'https://open-problem-7.vercel.app/', kind:'web'},
    {type:'Open Problem', label:'Open Problem 8', url:'https://open-problem-8.vercel.app/', kind:'web'}
  ]
};

/* upcoming level offerings */
const UPCOMING = [
  {sec:'aai',  title:'Applied AI', c1:'#4C1D95', c2:'#7C3AED', levels:[
    {level:'Level 1'}, {level:'Level 2'}, {level:'Level 3'}, {level:'Level 4'}]},
  {sec:'comm', title:'Communication Skills', c1:'#0E7490', c2:'#22B8CF', levels:[
    {level:'Level 2', name:'Trade and Team Communication'},
    {level:'Level 3', name:'Supervisory Communication Skills'},
    {level:'Level 4', name:'Junior Management Communication Skills'},
    {level:'Level 5', name:'Interpersonal Communication for Managers'},
    {level:'Level 6', name:'Cross-Cultural and Executive Presence Communication'},
    {level:'Level 7', name:'Strategic Negotiation and Crisis Leadership Communication'},
    {level:'Level 8', name:'Research, Governance and Thought-Leadership Communication'}]}
];

/* roadmap entries only: no course titles, links, dates or partnership claims */
const PROVIDERS = ['Google', 'Snowflake', 'Intel', 'AWS', 'Britannica'];
const DOMAINS = ['AI/ML', 'Data Science', 'Cybersecurity', 'Cloud Computing', 'Data Engineering', 'Digital Literacy'];

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const secOf = id => SECTIONS.find(s=>s.id===id);
const inSec = id => COURSES.filter(c=>c.sec===id);
const byId = id => COURSES.find(c=>c.id===id);
const progOf = c => secOf(c.sec).prog;
const KEY = 'saa-courses-progress';   // progress lives in this browser only
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
function saveProgress(){ try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3000); }

const ICON = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  'Reading Card':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 8h6M8 12h6"/></svg>',
  'Quiz':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></svg>',
  'Open Problem':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
};
const ART = {
  aai:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8l4.5 13.5L50 26l-13.5 4.5L32 44l-4.5-13.5L14 26l13.5-4.5z"/><path d="M48 40l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>',
  comm:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14h30a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H22l-8 7v-7h-6a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z"/><path d="M46 24h10a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-4v6l-7-6h-9a4 4 0 0 1-4-4v-2"/></svg>'
};

/* =====================================================================
   VIEWS
   ===================================================================== */
function card(c, i, n){
  const s = secOf(c.sec), p = progress[c.id] || {};
  const pill = p.done ? '<span class="pill done">&#10003; Completed</span>' : p.opened ? '<span class="pill go">In progress</span>' : '<span class="pill new">Play now</span>';
  const meta = [s.unit ? s.unit+' '+(i+1)+' of '+n : '', c.hours ? c.hours+' hours' : 'Interactive'].filter(Boolean).join(' &middot; ');
  return `<a class="card" href="#/play/${c.id}">
    <div class="thumb" style="--c1:${s.c1};--c2:${s.c2};">
      <img src="${esc(c.img)}" alt="" width="800" height="500" loading="eager" decoding="async">
      <span class="playbtn" aria-hidden="true">${ICON.play}</span>
      <span class="tag">${esc(s.title)}</span>
    </div>
    <div class="body">
      <div class="prov"><span>${PROGRAMMES[s.prog].brand}</span><span class="lvl">${esc(c.level)}</span></div>
      <h3>${esc(c.title)}</h3>
      ${c.one ? `<p class="one">${esc(c.one)}</p>` : ''}
      <div class="meta">${meta}</div>
      <div class="foot">${pill}</div>
    </div>
  </a>`;
}
function sample(x){
  return x.kind==='folder'
    ? `<a class="sm folder" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><div class="sm-top"><span class="sm-ic" aria-hidden="true">${ICON.folder}</span><div><h3>${esc(x.label)}</h3><small>Google Drive asset collection. May require access.</small></div></div><span class="sm-cta">Open asset folder ${ICON.ext}<span class="sr-only"> (opens in a new tab)</span></span></a>`
    : `<a class="sm" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><div class="sm-top"><span class="sm-ic" aria-hidden="true">${ICON[x.type]||ICON.info}</span><div><h3>${esc(x.label)}</h3><small>Web sample. Opens in a new tab.</small></div></div><span class="sm-cta">Open sample ${ICON.ext}<span class="sr-only"> (opens in a new tab)</span></span></a>`;
}
function levelTile(g, l){
  return `<div class="lv"><span class="lv-art" style="--c1:${g.c1};--c2:${g.c2};" aria-hidden="true">${ART[g.sec]}</span><div class="lv-txt"><h3>${esc(g.title)} - ${esc(l.level)}</h3>${l.name ? `<p>${esc(l.name)}</p>` : ''}<span class="pill soon">Coming soon</span></div></div>`;
}

function renderLabs(){
  const labs = inSec('fsl'), done = labs.filter(c=>(progress[c.id]||{}).done).length;
  document.title = 'Future Skills Labs';
  return `<section class="hero">
      <div class="eyebrow">For schools</div>
      <h1>Future Skills Labs</h1>
      <p>Hands-on labs for school students. Each lab opens and plays right here on this page.</p>
      <div class="stats"><span class="stat"><b>School level</b></span><span class="stat"><b>${labs.length}</b> labs</span><span class="stat"><b>${done}</b> of ${labs.length} completed</span></div>
    </section>
    <section class="sec" aria-labelledby="h-fsl"><h2 id="h-fsl" class="sr-only">Future Skills Lab labs</h2>
      <div class="grid">${labs.map((c,i)=>card(c, i, labs.length)).join('')}</div>
    </section>
    <footer class="site-foot">${PROGRAMMES.labs.foot}</footer>`;
}

function renderAcademy(){
  document.title = 'Swift AI Academy | Higher education';
  const aai = inSec('aai'), m = COMM_L1;
  const web = m.items.filter(x=>x.kind==='web').length, folders = m.items.length - web;
  const groups = m.groups.map(([type, heading])=>{
    const items = m.items.filter(x=>x.type===type); if(!items.length) return '';
    return `<h4 class="grp">${esc(heading)} <span class="count">${items.length}</span></h4><div class="sm-grid">${items.map(sample).join('')}</div>`;
  }).join('');
  return `<section class="hero">
      <div class="eyebrow">For higher education</div>
      <h1>Swift AI Academy</h1>
      <p>Explore hands-on courses, course samples and upcoming learning pathways.</p>
      <div class="jump" style="margin-top:18px;">${[['aai','Applied AI'],['comm','Communication Skills'],['upcoming','Upcoming']].map(([id,t])=>`<button class="chip-btn" onclick="jump('${id}')">${t}</button>`).join('')}</div>
    </section>

    <section class="sec" id="sec-aai" aria-labelledby="h-aai">
      <div class="sec-head"><h2 id="h-aai">Applied AI <span class="lvl lvl-lg">NSQF Level 4</span></h2><p>Use AI on real tasks, and check it before you trust it.</p></div>
      <div class="grid">${aai.map((c,i)=>card(c, i, aai.length)).join('')}</div>
    </section>

    <section class="sec" id="sec-comm" aria-labelledby="h-comm">
      <div class="sec-head"><h2 id="h-comm">Communication Skills <span class="lvl lvl-lg">${esc(m.level)}</span></h2><p>${esc(m.course)} &middot; ${esc(m.module)}: ${web} web samples and ${folders} asset folders.</p></div>
      <div class="note" role="note">${ICON.info}<span>${esc(m.note)}</span></div>
      ${groups}
    </section>

    <section class="sec" id="sec-upcoming" aria-labelledby="h-upcoming">
      <div class="sec-head"><h2 id="h-upcoming">Upcoming</h2><p>More levels on the way.</p></div>
      ${UPCOMING.map(g=>`<h4 class="grp">${esc(g.title)} <span class="count">${g.levels.length} levels</span></h4><div class="lv-grid">${g.levels.map(l=>levelTile(g, l)).join('')}</div>`).join('')}
    </section>
    <footer class="site-foot">${PROGRAMMES.academy.foot}</footer>`;
}

function renderOem(){
  document.title = 'OEMs and Domains | Swift AI Academy';
  return `<section class="hero">
      <div class="eyebrow">Coming soon</div>
      <h1>Upcoming courses from OEMs and learning providers</h1>
      <p>Explore upcoming learning opportunities across AI/ML, Data Science, Cybersecurity and more.</p>
    </section>
    <section class="sec" aria-labelledby="h-providers">
      <div class="sec-head"><h2 id="h-providers">Providers <span class="count">${PROVIDERS.length}</span></h2></div>
      <div class="pv-grid">${PROVIDERS.map(p=>`<div class="pv"><h3>${esc(p)}</h3><span class="pill soon">Coming soon</span></div>`).join('')}</div>
      <p class="pv-more">More providers coming soon.</p>
    </section>
    <section class="sec" aria-labelledby="h-domains">
      <div class="sec-head"><h2 id="h-domains">Domains <span class="count">${DOMAINS.length}</span></h2></div>
      <ul class="domains">${DOMAINS.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>
    </section>
    <footer class="site-foot">${PROGRAMMES.oem.foot}</footer>`;
}
function jump(id){ const el = $('sec-'+id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }

/* =====================================================================
   PLAYER: same tab, same page
   ===================================================================== */
let current = null, lastProg = 'labs';
const scrollMem = {};
function openPlayer(c){
  const s = secOf(c.sec), list = inSec(c.sec), i = list.indexOf(c);
  $('psub').textContent = s.title+' · '+(s.unit ? s.unit+' '+(i+1)+' of '+list.length : c.level);
  $('ptitle').textContent = c.title;
  $('pback-label').textContent = PROGRAMMES[s.prog].back;
  document.title = c.title+' | '+PROGRAMMES[s.prog].title;
  if(!current || current.id!==c.id){ $('loading').hidden = false; $('frame').src = c.url; }
  current = c;
  progress[c.id] = Object.assign({}, progress[c.id], {opened:Date.now()}); saveProgress();
  const j = list.indexOf(c);
  $('prev').disabled = j<=0; $('next').disabled = j>=list.length-1;
  doneButton();
  $('page').hidden = true; $('player').hidden = false; document.body.classList.add('playing');
}
function closePlayer(){
  if(!current) return false;
  current = null; $('frame').src = 'about:blank';
  $('player').hidden = true; $('page').hidden = false; document.body.classList.remove('playing');
  return true;
}
function leavePlayer(){ location.hash = '#/'+(current ? progOf(current) : lastProg); }
function doneButton(){ const d = !!(progress[current.id]||{}).done, b = $('done'); b.classList.toggle('on', d); b.innerHTML = d ? '&#10003; Completed' : 'Mark as complete'; }
function toggleDone(){ const p = progress[current.id] = progress[current.id] || {}; p.done = !p.done; saveProgress(); doneButton(); toast(p.done ? current.title+' completed' : 'Marked as not complete'); }
function step(d){ const list = inSec(current.sec), n = list[list.indexOf(current)+d]; if(n) location.hash = '#/play/'+n.id; }
function fullScreen(){ const s = $('stage'); (s.requestFullscreen || s.webkitRequestFullscreen || function(){}).call(s); }
$('frame').addEventListener('load', ()=>{ if($('frame').src !== 'about:blank') $('loading').hidden = true; });

/* =====================================================================
   ROUTING
   ===================================================================== */
const VIEWS = {labs:renderLabs, academy:renderAcademy, oem:renderOem};
let lastView = '';
function route(){
  const h = location.hash, play = h.match(/^#\/play\/([\w-]+)$/), c = play && byId(play[1]);
  if(c){ if(!current && lastView) scrollMem[lastView] = window.scrollY; lastProg = progOf(c); setTabs(lastProg); openPlayer(c); return; }
  const fromPlayer = closePlayer();
  let view = (h.match(/^#\/(labs|academy|oem)$/)||[])[1];
  if(!view){ view = 'labs'; history.replaceState(null, '', '#/labs'); }
  if(lastView && !fromPlayer) scrollMem[lastView] = window.scrollY;
  lastProg = view; setTabs(view);
  $('main').innerHTML = VIEWS[view]();
  window.scrollTo(0, (fromPlayer || view===lastView) ? (scrollMem[view]||0) : 0);
  lastView = view;
}
function setTabs(prog){ ['labs','academy','oem'].forEach(p=>{ const a = $('tab-'+p); if(p===prog) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); }); }
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
